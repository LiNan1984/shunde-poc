name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 沙箱与离线：测试不打外网（无 embedding/chat/mineru 配置即走本地确定性后端）
      POC_LOAD_SECRETS: "0"
      POC_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install CJK font (report charts resolve one; deploy image uses fonts-wqy-zenhei)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-wqy-zenhei
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r poc/requirements.txt pytest pytest-cov
      - name: Run test suite
        run: pytest poc/tests tests -q
      - name: Excel QA golden eval self-test (must be 100%)
        run: |
          python scripts/excel_qa_eval.py --build
          python scripts/excel_qa_eval.py --self-test
      - name: KB golden eval (offline, gated hit-rate >= 0.8)
        run: python scripts/kb_eval.py
